<!-- ホーム画面アイコン。
     外部ファイル(icons/*.png)への参照だと、ホスティング環境やパスの
     状況によってはSafariの「ホーム画面に追加」時にアイコンが取得
     できず、既定のスクリーンショット風アイコンになることがある。
     base64で直接埋め込むことで、ファイルの到達性に一切依存しない
     確実な方法にした。iOS側が角丸マスクを掛けるため、画像側は
     角を丸めない全面(full-bleed)で用意している。
     意匠は「地平線に半分沈む太陽」1つに絞ったフラットな二色構成。

     だけで輪郭が残るように、ぼかしや光暈を使わずシャープな輪郭で
     描いている（歯車やロゴではなく、アプリの空そのものを縮図にする
     という方針は維持しつつ、単色化に強い形に絞った）。 -->

       それ自体は主張しない。
     ・一貫性のために「使ってよい値」を下の :root に閉じ込める。
       角丸・余白・文字サイズ・色は必ず変数から取り、
       個別の数値をコンポーネント側に書かない。
     ・アクセントカラー(ember)を使ってよいのは2箇所だけ:
       「今日の負荷」リングと、期限が迫ったタスクの表示。
       主ボタン・トグル・チェックはインク色（空に対する対比色）を使う。
       旧版はボタン・スライダー・トグル・チェックすべてを橙にしていて、
       夜空の上で橙面積が大きくなりすぎていた。
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  /* アクセント（使用箇所は限定する） */
  --ember: #F2A65A;
  /* 期限が迫った表示の文字色。明るい空の上では #F2A65A だと薄すぎるため、
     トーンごとに切り替える（色だけに頼らず文言でも伝えている前提の補助）。 */
  --ember-text: #B45F18;

  /* 角丸 — この4つ以外を使わない */
  --r-sheet: 28px;
  --r-card: 22px;
  --r-ctl: 14px;
  --r-pill: 999px;

  /* 余白スケール */
  --sp-1: 6px;
  --sp-2: 10px;
  --sp-3: 14px;
  --sp-4: 18px;
  --sp-5: 24px;

  /* 文字 */
  --font-display: 'Zen Old Mincho', serif;
  --font-ui: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
  --fs-hero: 27px;
  --fs-title: 19px;
  --fs-body: 15px;
  --fs-meta: 13px;
  --fs-label: 11.5px;

  /* 操作対象の最小高さ（指で押せる大きさを全コンポーネントで揃える） */
  --tap: 44px;

  /* ナビの寸法。本文下端の余白もFABの位置もここから計算する */
  --nav-h: 52px;
  --nav-gap: 14px;

  /* テキストトーン（空の明暗に応じてJSがlight/darkを切り替える） */
  --ink: #26241E;
  --ink-soft: rgba(38, 36, 30, 0.64);
  --ink-faint: rgba(38, 36, 30, 0.46);
  --ink-invert: #FBF7EE;
  --glass-fill: rgba(255, 255, 255, 0.34);
  --glass-fill-strong: rgba(255, 255, 255, 0.46);
  --glass-line: rgba(255, 255, 255, 0.50);
  --glass-shadow: rgba(30, 24, 10, 0.12);
  --scrim: rgba(28, 24, 16, 0.30);
}
:root[data-tone="light"] {
  --ember-text: #F2A65A;

  /* 空の下端の色。JSが現在の空に合わせて更新する（白帯対策） */
  --canvas: #29385F;
}
:root[data-tone="light"] {
  --ink: #FBF7EE;
  --ink-soft: rgba(251, 247, 238, 0.74);
  --ink-faint: rgba(251, 247, 238, 0.46);
  --ink-invert: #171A2B;
  --glass-fill: rgba(22, 20, 34, 0.26);
  --glass-fill-strong: rgba(24, 22, 38, 0.44);
  --glass-line: rgba(255, 255, 255, 0.16);
  --glass-shadow: rgba(0, 0, 0, 0.26);
  --scrim: rgba(6, 8, 18, 0.46);
}

/* html の背景色 = 空の下端の色。fixed要素が届かない領域
   （Safariの上下バー、standalone時のホームインジケータ周辺）は
   ここが透けるため、旧版では白帯として見えていた。 */
html {
  height: 100%;
  background-color: var(--canvas);
  transition: background-color 3s ease;
}
body {
  height: 100%;
  min-height: 100dvh;
  overflow: hidden;
  background-color: transparent;
  font-family: var(--font-ui);
  color: var(--ink);
  font-size: var(--fs-body);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  transition: color .6s ease;
}

/* ============================================================
   空（背景全面、時間経過で緩やかに変化）
   ============================================================ */
#sky {
  position: fixed; inset: 0; z-index: 0;
  transition: background 3s ease;
  overflow: hidden;
}
#sky-stars { position: absolute; inset: 0; opacity: 0; transition: opacity 3s ease; pointer-events: none; }
.star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle-star ease-in-out infinite; }
@keyframes twinkle-star { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.3); } }

#sky-sun {
  position: absolute; border-radius: 50%;
  transform: translate(-50%, -50%);
  filter: blur(1px);
  transition: opacity 3s ease, background 3s ease, left 8s ease, top 8s ease, width 3s ease, height 3s ease;
  pointer-events: none;
}

#sky-clouds { position: absolute; inset: 0; transition: opacity 2s ease; pointer-events: none; }
.cloud {
  position: absolute; height: 11vw; min-height: 44px; max-height: 90px;
  filter: drop-shadow(0 6px 14px rgba(20,20,30,0.08));
  animation: driftCloud linear infinite;
  color: rgba(255,255,255,0.6);
}
.cloud svg { width: 100%; height: 100%; display: block; overflow: visible; }
.cloud-puff { fill: currentColor; transition: fill 2s ease; }
@keyframes driftCloud { from { transform: translateX(-40vw); } to { transform: translateX(140vw); } }

#sky-rain { position: absolute; inset: 0; opacity: 0; transition: opacity 1.5s ease; pointer-events: none; }
#sky[data-condition="rain"] #sky-rain { opacity: 1; }
.rain-drop {
  position: absolute; top: -10%; width: 1.5px; height: 5vh;
  background: linear-gradient(rgba(255,255,255,0), rgba(255,255,255,0.4));
  animation: fallRain linear infinite;
}
@keyframes fallRain { to { transform: translateY(120vh); } }

/* 空の下側を静かに落とすヴェール（文字の可読性のため、weather.js が色を決める） */
#sky-scrim { position: absolute; inset: 0; pointer-events: none; transition: background 3s ease; }

#sky-veil {
  position: absolute; inset: 0; background: rgba(255,255,255,0.04);
  opacity: 0; transition: opacity 2s ease; pointer-events: none; mix-blend-mode: overlay;
}
#sky[data-condition="rain"] /* 空の下側を静かに落とすヴェール（文字の可読性のため、weather.js が色を決める） */
#sky-scrim { position: absolute; inset: 0; pointer-events: none; transition: background 3s ease; }

#sky-veil { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .star, .cloud, .rain-drop, #sky-sun { animation: none !important; }
  * { transition-duration: .01ms !important; }
}

/* ============================================================
   ガラス（唯一の材質定義）
   ============================================================ */
.glass {
  background: var(--glass-fill);
  backdrop-filter: blur(22px) saturate(140%);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
  border: 1px solid var(--glass-line);
  border-radius: var(--r-card);
  box-shadow: 0 8px 28px -10px var(--glass-shadow);
}
.glass-strong { background: var(--glass-fill-strong); }

/* ============================================================
   レイアウト
   ============================================================ */
#app { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; }
#main-content {
  flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  /* 下端は「ナビの錠剤」と「追加ボタン」の両方を避ける高さまで空ける。
     旧版は最後のカードがナビの裏に隠れて押せなくなることがあった。 */
  padding:
    calc(var(--safe-top) + var(--sp-5)) var(--sp-4)
    calc(var(--nav-h) + var(--nav-gap) + 52px + var(--sp-3) + var(--safe-bottom) + var(--sp-4));
}
.page-wrap { max-width: 560px; margin: 0 auto; }

/* 画面ごとの共通ヘッダ。今日画面もタスク画面も設定画面も
   同じ余白・同じ書体で始めることで一貫性を保つ。 */
.page-head { padding: 0 var(--sp-1) var(--sp-4); }
.page-title { font-family: var(--font-display); font-size: var(--fs-title); font-weight: 500; letter-spacing: .04em; }
.section-label {
  font-size: var(--fs-label); color: var(--ink-faint);
  padding: 0 var(--sp-1) var(--sp-2); letter-spacing: .08em;
}
.card { padding: var(--sp-4); margin-bottom: var(--sp-2); }

/* ============================================================
   ナビゲーション（下部、内容幅ぴったりのガラスの錠剤）
   ------------------------------------------------------------
   旧版は left:50% だけを指定していたため、fixed要素の
   shrink-to-fit 幅が「画面幅の半分」に制限され、「今日」が
   縦に折れていた（実機で不自然な形になっていた直接の原因）。
   width:max-content と white-space:nowrap で確実に横書きにする。
   ============================================================ */
#nav-bar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--safe-bottom) + var(--nav-gap));
  z-index: 40;
  display: flex; gap: 2px; padding: 4px;
  width: max-content; max-width: calc(100vw - var(--sp-5) * 2);
  border-radius: var(--r-pill);
}
.nav-item {
  display: flex; flex-direction: row; align-items: center; gap: 7px;
  white-space: nowrap;
  height: calc(var(--nav-h) - 8px); padding: 0 16px;
  border: none; background: none; cursor: pointer;
  color: var(--ink-faint); border-radius: var(--r-pill);
  transition: color .25s ease, background .25s ease;
  font-family: var(--font-ui); font-size: 12.5px; font-weight: 500; line-height: 1;
}
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav-item.active { color: var(--ink); background: var(--glass-fill-strong); }

/* ============================================================
   今日画面
   ============================================================ */
.today-date { font-family: var(--font-display); font-size: var(--fs-hero); font-weight: 500; letter-spacing: .04em; }
.today-sky-row {
  display: flex; align-items: center; gap: 8px; margin-top: var(--sp-1);
  color: var(--ink-soft); font-size: var(--fs-meta);
}
.weather-glyph { width: 18px; height: 18px; flex-shrink: 0; }

/* 進捗カード */
.progress-card { display: flex; flex-direction: column; gap: var(--sp-3); }
.progress-main { display: flex; align-items: center; gap: var(--sp-3); }
.load-ring-svg { width: 54px; height: 54px; flex-shrink: 0; }
.load-ring-track { fill: none; stroke: var(--glass-line); stroke-width: 4.5; opacity: .55; }
.load-ring-planned { fill: none; stroke: var(--ink-soft); stroke-width: 4.5; stroke-linecap: round; }
.load-ring-done {
  fill: none; stroke: var(--ember); stroke-width: 4.5; stroke-linecap: round;
  transition: stroke-dashoffset .6s cubic-bezier(.4,0,.2,1);
}
.progress-text { flex: 1; min-width: 0; }
.progress-value { font-size: var(--fs-meta); color: var(--ink-soft); }
.progress-value b { font-family: var(--font-display); font-size: 24px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.progress-sub { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }

/* 平日 / 休日 の切り替え（SPEC §5 の容量を手動で選ぶ） */
.segmented {
  display: flex; gap: 2px; padding: 3px; border-radius: var(--r-pill);
  background: var(--glass-fill); border: 1px solid var(--glass-line);
}
.segmented button {
  flex: 1; border: none; background: none; cursor: pointer;
  padding: 7px 10px; border-radius: var(--r-pill);
  font-family: var(--font-ui); font-size: 12.5px; font-weight: 500; line-height: 1;
  color: var(--ink-faint); white-space: nowrap;
  transition: color .2s ease, background .2s ease;
}
.segmented button.active { color: var(--ink); background: var(--glass-fill-strong); }
.segmented-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
.segmented-row .segmented { flex: 0 0 auto; min-width: 148px; }
.segmented-caption {
  font-size: 12px; color: var(--ink-faint); min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ============================================================
   タスクカード（今日画面 / タスク画面で同じ見た目を共有する）
   ============================================================ */
.task-card {
  display: flex; align-items: flex-start; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4); margin-bottom: 8px;
  animation: cardIn .4s cubic-bezier(.2,.8,.3,1) both;
  transition: opacity .35s ease, transform .35s ease;
}
.task-card.completing { opacity: 0; transform: scale(.96) translateY(4px); }
@keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.task-card.done .task-title { opacity: .45; text-decoration: line-through; }

.task-check {
  width: 25px; height: 25px; border-radius: 50%; flex-shrink: 0; margin-top: 2px;
  border: 1.6px solid var(--glass-line); background: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .2s ease, border-color .2s ease;
}
.task-check svg { width: 13px; height: 13px; opacity: 0; transition: opacity .15s ease; color: var(--ink-invert); }
.task-check.checked { background: var(--ink); border-color: var(--ink); }
.task-check.checked svg { opacity: 1; }

.task-main { flex: 1; min-width: 0; }
.task-title { font-size: var(--fs-body); font-weight: 500; line-height: 1.5; word-break: break-word; }
.task-meta-row { display: flex; align-items: center; gap: var(--sp-2); margin-top: 5px; flex-wrap: wrap; }
.task-meta-chip { font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.task-meta-chip.urgent { color: var(--ember-text); }
.load-chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums;
}
.load-dot-row { display: flex; gap: 2.5px; align-items: center; }
.load-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-faint); opacity: .45; }
.load-dot.filled { background: var(--ink-soft); opacity: 1; }

.task-list-actions { display: flex; gap: 2px; flex-shrink: 0; margin-top: -2px; }
.icon-btn {
  width: 34px; height: 34px; border-radius: 50%; border: none; background: none;
  color: var(--ink-faint); cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .15s ease, color .15s ease;
}
.icon-btn:active { background: var(--glass-fill-strong); color: var(--ink); }
.icon-btn svg { width: 15px; height: 15px; }

.empty-state { text-align: center; padding: var(--sp-5) var(--sp-4); color: var(--ink-faint); }
.empty-state .glyph { font-size: 22px; margin-bottom: var(--sp-1); opacity: .55; }
.empty-state .msg { font-size: var(--fs-meta); color: var(--ink-soft); }

/* 追加ボタン（タスク画面のみ。ナビの錠剤と重ならない高さに置く） */
.fab {
  position: fixed; right: var(--sp-4);
  bottom: calc(var(--safe-bottom) + var(--nav-gap) + var(--nav-h) + var(--sp-3));
  width: 52px; height: 52px; border-radius: 50%; z-index: 39;
  border: none; cursor: pointer; color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s ease;
}
.fab:active { transform: scale(.92); }
.fab svg { width: 21px; height: 21px; }

/* ============================================================
   シート / モーダル（同一の骨格を共有する）
   ============================================================ */
.overlay {
  position: fixed; inset: 0; z-index: 100; background: var(--scrim);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .24s ease;
  -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
}
.overlay.open { opacity: 1; pointer-events: auto; }
.sheet {
  /* min-width:0 が無いと、日付入力の最小内容幅にフレックス項目が
     引き伸ばされ、シート全体が画面からはみ出す（旧版の不具合）。 */
  width: 100%; min-width: 0; max-width: 560px;
  padding: var(--sp-2) var(--sp-5) calc(var(--sp-5) + var(--safe-bottom));
  border-radius: var(--r-sheet) var(--r-sheet) 0 0;
  max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain;
  transform: translateY(100%); transition: transform .32s cubic-bezier(.32,.72,0,1);
}
.overlay.open .sheet { transform: translateY(0); }
.sheet-grabber {
  width: 36px; height: 4px; border-radius: var(--r-pill);
  background: var(--ink-faint); opacity: .5;
  margin: 0 auto var(--sp-4);
}
.sheet-title { font-family: var(--font-display); font-size: var(--fs-title); font-weight: 500; margin-bottom: var(--sp-4); }
.sheet-row {
  display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3);
  padding: var(--sp-2) 0; border-bottom: 1px solid var(--glass-line); font-size: var(--fs-meta);
}
.sheet-row:last-of-type { border-bottom: none; }
.sheet-row-label { color: var(--ink-faint); flex-shrink: 0; }
.sheet-note {
  margin-top: var(--sp-3); padding: var(--sp-3); border-radius: var(--r-ctl);
  background: var(--glass-fill-strong); font-size: 12.5px; color: var(--ink-soft); line-height: 1.7;
}
.sheet-actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-4); }
.sheet-actions .btn { flex: 1; }

/* ============================================================
   フォーム部品（すべての画面で同じ部品を使う）
   ============================================================ */
.field { margin-bottom: var(--sp-4); }
.field-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-1); }
.field-label { font-size: var(--fs-label); color: var(--ink-faint); letter-spacing: .06em; }
.field-clear {
  border: none; background: none; cursor: pointer; padding: 2px 4px;
  font-family: var(--font-ui); font-size: var(--fs-label); color: var(--ink-faint);
}
.field-clear:active { color: var(--ink); }

.input-row { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.form-input {
  flex: 1; width: 100%; min-width: 0;
  height: var(--tap); padding: 0 var(--sp-3); border-radius: var(--r-ctl);
  font-size: var(--fs-body); font-family: var(--font-ui);
  border: 1px solid var(--glass-line); background: var(--glass-fill-strong); color: var(--ink);
  outline: none; -webkit-appearance: none; appearance: none;
}
.form-input::placeholder { color: var(--ink-faint); }
.form-input:focus { border-color: var(--ink-faint); }
input[type="date"].form-input { display: block; line-height: var(--tap); }
input[type="date"].form-input::-webkit-date-and-time-value { text-align: left; margin: 0; }
input[type="date"].form-input::-webkit-calendar-picker-indicator { opacity: .45; }
:root[data-tone="light"] input[type="date"].form-input::-webkit-calendar-picker-indicator { filter: invert(1); }

/* 数値レンジ（負荷・キャパシティで共用する唯一のスライダー部品） */
/* 週次タスクの曜日選択。7個を常に1行に収めるため固定幅ではなく
   flex:1 で等分する（幅の狭い端末でも折り返さない）。 */
.weekday-picker { display: flex; gap: 4px; }
.weekday-picker button {
  flex: 1; min-width: 0; height: 38px; border-radius: var(--r-ctl);
  border: 1px solid var(--glass-line); background: var(--glass-fill);
  color: var(--ink-soft); cursor: pointer; font-family: var(--font-ui);
  font-size: 12.5px; font-weight: 500;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}
.weekday-picker button.active { background: var(--ink); color: var(--ink-invert); border-color: var(--ink); }

.range-field { display: flex; align-items: center; gap: var(--sp-2); }
.range-step {
  width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%;
  border: 1px solid var(--glass-line); background: var(--glass-fill);
  color: var(--ink-soft); cursor: pointer; font-size: 16px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
.range-step:active { background: var(--glass-fill-strong); color: var(--ink); }
.range-value {
  min-width: 34px; text-align: right; font-variant-numeric: tabular-nums;
  font-size: 17px; font-weight: 600; font-family: var(--font-display);
}
input[type="range"] {
  flex: 1; min-width: 0; height: 30px; background: transparent;
  -webkit-appearance: none; appearance: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px; border-radius: var(--r-pill);
  background: linear-gradient(to right, var(--ink-soft) 0 var(--fill, 0%), var(--glass-line) var(--fill, 0%) 100%);
}
input[type="range"]::-moz-range-track {
  height: 4px; border-radius: var(--r-pill);
  background: linear-gradient(to right, var(--ink-soft) 0 var(--fill, 0%), var(--glass-line) var(--fill, 0%) 100%);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 20px; height: 20px; border-radius: 50%; margin-top: -8px;
  background: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.28);
}
input[type="range"]::-moz-range-thumb {
  width: 20px; height: 20px; border: none; border-radius: 50%;
  background: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.28);
}

.btn {
  height: var(--tap); padding: 0 var(--sp-4); border-radius: var(--r-ctl);
  font-size: 14.5px; font-weight: 500; font-family: var(--font-ui);
  border: none; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: opacity .15s ease, transform .1s ease;
}
.btn:active { transform: scale(.98); }
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--ink); color: var(--ink-invert); }
.btn-secondary { background: var(--glass-fill-strong); color: var(--ink); border: 1px solid var(--glass-line); }
.btn-danger { background: var(--glass-fill-strong); color: #E0644F; border: 1px solid var(--glass-line); }
:root[data-tone="light"] .btn-danger { color: #FF8A73; }
.btn-full { width: 100%; }

/* ============================================================
   設定画面
   ============================================================ */
.settings-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
.settings-row-title { font-size: 14px; }
.settings-desc { font-size: 12px; color: var(--ink-faint); margin-top: 4px; line-height: 1.6; }
.settings-stack { display: flex; flex-direction: column; gap: var(--sp-2); }
.settings-divider { height: 1px; background: var(--glass-line); margin: var(--sp-3) 0; }

.toggle {
  width: 46px; height: 28px; flex-shrink: 0; border-radius: var(--r-pill); border: 1px solid var(--glass-line);
  background: var(--glass-fill); position: relative; cursor: pointer; transition: background .2s ease;
}
.toggle::after {
  content: ''; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--ink-faint); transition: transform .2s cubic-bezier(.4,0,.2,1), background .2s ease;
}
.toggle.on { background: var(--ink); border-color: var(--ink); }
.toggle.on::after { transform: translateX(18px); background: var(--ink-invert); }

#toast {
  position: fixed; left: 50%;
  bottom: calc(var(--safe-bottom) + var(--nav-gap) + var(--nav-h) + 52px + var(--sp-4));
  transform: translateX(-50%) translateY(10px);
  z-index: 210; padding: 11px 20px; border-radius: var(--r-pill);
  font-size: 13px; color: var(--ink); text-align: center;
  max-width: min(calc(100vw - 132px), 320px);
  opacity: 0; transition: opacity .2s ease, transform .2s ease; pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
/* シートを開いている最中の通知（入力エラーなど）は、シートに隠れないよう上部へ */
body:has(.overlay.open) #toast {
  bottom: auto; top: calc(var(--safe-top) + var(--sp-2));
  transform: translateX(-50%) translateY(-10px);
}
body:has(.overlay.open) #toast.show { transform: translateX(-50%) translateY(0); }

::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>

<div id="sky" data-time="day" data-condition="clear">
  <div id="sky-sun"></div>
  <div id="sky-clouds"></div>
  <div id="sky-rain"></div>
  <div id="sky-veil"></div>
  <div id="sky-stars"></div>
  <div id="sky-scrim"></div>
</div>

<div id="app">
  <div id="main-content"><div class="page-wrap" id="page-root"></div></div>

  <nav id="nav-bar" class="glass">
    <button class="nav-item active" data-page="today" onclick="Temper.navigateTo('today')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><line x1="12" y1="2.5" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="21.5"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="2.5" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="21.5" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg><span>今日</span>
    </button>
    <button class="nav-item" data-page="tasks" onclick="Temper.navigateTo('tasks')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h12"/><path d="M9 12h12"/><path d="M9 18h12"/><path d="M3.5 6h.01"/><path d="M3.5 12h.01"/><path d="M3.5 18h.01"/></svg><span>タスク</span>
    </button>
    <button class="nav-item" data-page="settings" onclick="Temper.navigateTo('settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg><span>設定</span>
    </button>
  </nav>
</div>

<!-- タスク詳細（長押しで開く、SPEC §11） -->
<div class="overlay" id="detail-sheet">
  <div class="sheet glass glass-strong" id="detail-sheet-body"></div>
</div>

<!-- タスク追加 / 編集 -->
<div class="overlay" id="modal-task">
  <div class="sheet glass glass-strong">
    <div class="sheet-grabber"></div>
    <div class="sheet-title" id="modal-task-title">タスクを追加</div>
    <div class="field">
      <div class="field-head"><label class="field-label" for="input-title">タイトル</label></div>
      <div class="input-row">
        <input type="text" id="input-title" class="form-input" placeholder="例：英単語 30個" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
      </div>
    </div>
    <div class="field">
      <div class="field-head"><span class="field-label">種別</span></div>
      <div class="segmented" id="task-type-segmented">
        <button type="button" class="active" data-type="once" onclick="Temper.setTaskType('once')">単発</button>
        <button type="button" data-type="weekly" onclick="Temper.setTaskType('weekly')">毎週</button>
      </div>
    </div>
    <div class="field" id="field-weekdays" style="display:none">
      <div class="field-head"><span class="field-label">曜日</span></div>
      <div class="weekday-picker" id="weekday-picker">
        <button type="button" data-day="0" onclick="Temper.toggleModalWeekDay(0)">日</button>
        <button type="button" data-day="1" onclick="Temper.toggleModalWeekDay(1)">月</button>
        <button type="button" data-day="2" onclick="Temper.toggleModalWeekDay(2)">火</button>
        <button type="button" data-day="3" onclick="Temper.toggleModalWeekDay(3)">水</button>
        <button type="button" data-day="4" onclick="Temper.toggleModalWeekDay(4)">木</button>
        <button type="button" data-day="5" onclick="Temper.toggleModalWeekDay(5)">金</button>
        <button type="button" data-day="6" onclick="Temper.toggleModalWeekDay(6)">土</button>
      </div>
    </div>
    <div class="field">
      <div class="field-head">
        <label class="field-label" for="input-deadline" id="input-deadline-label">期限</label>
        <button type="button" class="field-clear" onclick="Temper.clearDateField('input-deadline')">クリア</button>
      </div>
      <div class="input-row"><input type="date" id="input-deadline" class="form-input"></div>
    </div>
    <div class="field">
      <div class="field-head">
        <label class="field-label" for="input-unlock">解禁日</label>
        <button type="button" class="field-clear" onclick="Temper.clearDateField('input-unlock')">クリア</button>
      </div>
      <div class="input-row"><input type="date" id="input-unlock" class="form-input"></div>
    </div>
    <div class="field">
      <div class="field-head"><label class="field-label" for="input-load">負荷（1〜10、自分の感覚で）</label></div>
      <div class="range-field">
        <button type="button" class="range-step" onclick="Temper.stepLoad(-1)" aria-label="負荷を下げる">−</button>
        <input type="range" id="input-load" min="1" max="10" step="1" value="4" oninput="Temper.onLoadSliderInput(this.value)">
        <button type="button" class="range-step" onclick="Temper.stepLoad(1)" aria-label="負荷を上げる">＋</button>
        <span class="range-value" id="load-slider-val">4</span>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" onclick="Temper.closeTaskModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="Temper.saveTaskFromModal()">保存</button>
    </div>
  </div>
</div>

<!-- 確認（削除・インポートなど、取り消せない操作の前に必ず挟む） -->
<div class="overlay" id="modal-confirm">
  <div class="sheet glass glass-strong">
    <div class="sheet-grabber"></div>
    <div class="sheet-title" id="confirm-title">確認</div>
    <div id="confirm-body" style="font-size:var(--fs-meta);color:var(--ink-soft);line-height:1.8"></div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" id="confirm-cancel">キャンセル</button>
      <button class="btn btn-primary" id="confirm-ok">実行</button>
    </div>
  </div>
</div>

<input type="file" id="import-file" accept="application/json,.json" style="display:none">
<div id="toast" class="glass glass-strong"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
